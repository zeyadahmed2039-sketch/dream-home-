# Dream Home Online - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# Defines a Web Service (full-stack Next.js) + a managed PostgreSQL database.

services:
  - type: web
    name: dream-home-online
    runtime: node
    plan: free
    rootDir: .
    healthCheckPath: /
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      # Render injects DATABASE_URL automatically when linked via `databases`.
      - key: DATABASE_URL
        fromDatabase:
          name: dream-home-online-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # After first deploy, replace NEXTAUTH_URL and NEXT_PUBLIC_APP_URL with
      # your real Render URL (e.g. https://dream-home-online.onrender.com).
      # Until then the app falls back to RENDER_EXTERNAL_URL at runtime.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional Google OAuth:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: dream-home-online-db
    plan: free
    databaseName: dreamhome
    user: dreamhome_user