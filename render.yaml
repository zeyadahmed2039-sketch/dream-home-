# Dream Home Online - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# Defines a Web Service (full-stack Next.js) + a managed PostgreSQL database.

services:
  - type: web
    name: dream-home-online
    runtime: node
    plan: free
    rootDir: .
    branch: main
    healthCheckPath: /
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:prod
    autoDeployTrigger: commit
    envVars:
      # Render injects DATABASE_URL automatically when linked via `databases`.
      # If you created the Web Service manually, add DATABASE_URL manually from
      # the linked Postgres "Internal Database URL" (e.g.
      # postgres://dreamhome_user:PASSWORD@dpg-xxxx-a.oregon-postgres.render.com:5432/dreamhome_xxxx).
      - key: DATABASE_URL
        fromDatabase:
          name: dream-home-online-db
          property: connectionString
      # NextAuth v4 secret (canonical NEXTAUTH_SECRET). Auto-generated on
      # blueprint apply; for a manually-created service set it yourself via
      # `openssl rand -base64 32`.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Set to your live Render URL, e.g. https://dream-home-ainm.onrender.com.
      # Until then the app falls back to RENDER_EXTERNAL_URL at runtime.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional Google OAuth:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: dream-home-online-db
    plan: free
    databaseName: dreamhome
    user: dreamhome_user